<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1>Criar senha</h1>
      <p class="login-subtitle">Defina a senha de acesso à sua conta.</p>
    </div>

    <form class="login-form" #passwordForm="ngForm" (ngSubmit)="save(passwordForm)">

      <div class="form-fields">
        <div class="field">
          <label for="password">Nova senha *</label>
          <span class="p-input-icon-left w-100">
            <i class="pi pi-lock" aria-hidden="true"></i>
            <input
              pInputText
              id="password"
              placeholder="Nova senha"
              type="password"
              name="password"
              [(ngModel)]="password.password"
              #newPassword="ngModel"
              required
              minlength="6"
              class="form-control w-100"
              [disabled]="loading"
            />
          </span>

          <app-message
            [control]="newPassword"
            error="required"
            text="Informe a nova senha"
          ></app-message>
          <app-message
            [control]="newPassword"
            error="minlength"
            text="A senha deve ter pelo menos 6 caracteres"
          ></app-message>
        </div>

        <div class="field">
          <label for="passwordConfirmation"
            >Confirmar nova senha *</label
          >
          <span class="p-input-icon-left w-100">
            <i class="pi pi-lock" aria-hidden="true"></i>
            <input
              pInputText
              id="passwordConfirmation"
              placeholder="Confirmar nova senha"
              type="password"
              name="passwordConfirmation"
              [(ngModel)]="password.passwordConfirmation"
              #confirmation="ngModel"
              required
              minlength="6"
              class="form-control w-100"
              [disabled]="loading"
            />
          </span>

          <app-message
            [control]="confirmation"
            error="required"
            text="Confirme a nova senha"
          ></app-message>
          <app-message
            [control]="confirmation"
            error="minlength"
            text="A senha deve ter pelo menos 6 caracteres"
          ></app-message>
        </div>
      </div>

      <div class="token-warning" role="alert" *ngIf="!token">
        Token não encontrado. Solicite um novo link.
      </div>

      <div class="form-actions">
        <button
          type="submit"
          [disabled]="passwordForm.invalid || loading || !token"
          class="btn btn-primary login-form-button"
        >
          {{ loading ? "SALVANDO..." : "Criar senha" }}
        </button>

        <a
          routerLink="/customer-account/resend"
          class="btn btn-outline-danger cancel-button"
        >
          Solicitar novo link
        </a>
      </div>
    </form>
  </div>
</div>
